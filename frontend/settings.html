<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EyeGuard - 设置</title>
  <link rel="stylesheet" href="styles/theme.css">
  <style>
    body {
      width: 100%;
      height: 100vh;
      padding: 24px;
      background: var(--bg-primary, #0a1628);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      overflow-y: auto;
      box-sizing: border-box;
    }
    h2 {
      font-size: 18px;
      color: var(--accent, #4fc3f7);
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border, #0f3460);
      font-weight: 500;
    }
    .form-group {
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    label {
      font-size: 13px;
      color: var(--text-secondary, #78909c);
      white-space: nowrap;
      flex-shrink: 0;
    }
    select, input[type="number"] {
      flex: 1;
      min-width: 0;
      padding: 8px 12px;
      background: var(--bg-secondary, #0f3460);
      border: 1px solid var(--border, #0f3460);
      border-radius: 4px;
      color: var(--text-primary, #e0e0e0);
      font-size: 14px;
      outline: none;
      cursor: pointer;
      box-sizing: border-box;
    }
    input[type="checkbox"] {
      width: auto;
      padding: 0;
      background: var(--bg-secondary, #0f3460);
      border: 1px solid var(--border, #0f3460);
      border-radius: 4px;
      color: var(--text-primary, #e0e0e0);
      font-size: 14px;
      outline: none;
      cursor: pointer;
      box-sizing: border-box;
    }
    input[type="number"] {
      cursor: text;
      -moz-appearance: textfield;
    }
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    select:focus, input[type="number"]:focus {
      border-color: var(--accent, #4fc3f7);
    }
    select option {
      background: var(--bg-primary, #0a1628);
    }
    .idle-row .idle-input-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
    }
    .idle-row input[type="number"] {
      width: 50px;
      padding: 6px 8px;
    }
    .idle-row .unit {
      font-size: 13px;
      color: var(--text-secondary, #78909c);
    }
    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--border, #0f3460);
    }
    .actions button {
      padding: 8px 24px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-cancel {
      background: transparent;
      border: 1px solid var(--border, #0f3460) !important;
      color: var(--text-secondary, #78909c);
    }
    .btn-cancel:hover {
      background: var(--bg-secondary, #0f3460);
    }
    .btn-save {
      background: var(--accent, #4fc3f7);
      color: #fff;
    }
    .btn-save:hover {
      background: #3ab0e0;
    }
  </style>
</head>
<body>
  <h2>&#x2699; 爱眼卫士 设置</h2>

  <div class="form-group">
    <label>工作时间长度(分钟)</label>
    <input type="number" id="workInterval" min="1" max="480" step="1" value="45">
  </div>

  <div class="form-group">
    <label>休息时间长度(分钟)</label>
    <input type="number" id="restDuration" min="1" max="240" step="1" value="5">
  </div>

  <div class="form-group">
    <label>允许推迟休息次数(次)</label>
    <select id="maxPostpone"></select>
  </div>

  <div class="form-group">
    <label>强制休息模式</label>
    <select id="forceMode">
      <option value="none">非强制</option>
      <option value="soft">一般强制（休1分钟可解锁）</option>
      <option value="hard">完全强制（休息过程中不可解锁）</option>
    </select>
  </div>

  <div class="form-group">
    <input type="checkbox" id="pauseOnFullscreen">
    <label for="pauseOnFullscreen">软件全屏运行时暂停计时</label>
  </div>

  <div class="form-group idle-row">
    <input type="checkbox" id="idleDetectEnabled">
    <label for="idleDetectEnabled">键盘鼠标静止</label>
    <div class="idle-input-group" id="idleInputGroup">
      <input type="number" id="idleThreshold" min="3" max="30" value="5">
      <span class="unit">分钟后暂停计时</span>
    </div>
  </div>

  <div class="form-group">
    <input type="checkbox" id="autostart">
    <label for="autostart">开机自启动</label>
  </div>

  <div class="actions">
    <button class="btn-cancel" onclick="window.__cancelSettings()">取消</button>
    <button class="btn-save" onclick="window.__saveSettings()">保存</button>
  </div>

  <script>
    document.documentElement.style.background = '#0a1628';
    document.body.style.background = '#0a1628';

    const core = window.__TAURI__ && window.__TAURI__.core;
    if (!core || !core.invoke) {
      document.getElementById('errorMsg').style.display = 'block';
    } else {
      const invoke = core.invoke;

      invoke('get_settings').then(s => {
        document.getElementById('workInterval').value = s.work_interval_minutes;
        document.getElementById('restDuration').value = s.rest_duration_minutes;

        const mpSel = document.getElementById('maxPostpone');
        mpSel.innerHTML = '';
        for (let i = 1; i <= 6; i++) {
          const opt = document.createElement('option');
          opt.value = i; opt.textContent = i;
          if (i === s.max_postpone_count) opt.selected = true;
          mpSel.appendChild(opt);
        }
        document.getElementById('forceMode').value = s.force_mode;
        document.getElementById('pauseOnFullscreen').checked = s.pause_on_fullscreen;
        document.getElementById('idleDetectEnabled').checked = s.idle_detect_enabled;
        document.getElementById('idleThreshold').value = s.idle_threshold_minutes;

        updateIdleConfigVisibility();

        invoke('get_autostart').then(as => {
          document.getElementById('autostart').checked = as;
        }).catch(() => {});
      }).catch(e => {
        document.getElementById('errorMsg').textContent = '加载设置失败';
        document.getElementById('errorMsg').style.display = 'block';
      });

      document.getElementById('idleDetectEnabled').addEventListener('change', updateIdleConfigVisibility);

      function updateIdleConfigVisibility() {
        const enabled = document.getElementById('idleDetectEnabled').checked;
        document.getElementById('idleInputGroup').style.display = enabled ? 'flex' : 'none';
      }
    }

    window.__saveSettings = async function() {
      try {
        const ok = await core.invoke('confirm_dialog', { message: '确定要保存设置吗？' });
        if (!ok) return;
        await core.invoke('save_settings', {
          settings: {
            work_interval_minutes: parseInt(document.getElementById('workInterval').value),
            rest_duration_minutes: parseInt(document.getElementById('restDuration').value),
            max_postpone_count: parseInt(document.getElementById('maxPostpone').value),
            force_mode: document.getElementById('forceMode').value,
            pause_on_fullscreen: document.getElementById('pauseOnFullscreen').checked,
            idle_detect_enabled: document.getElementById('idleDetectEnabled').checked,
            idle_threshold_minutes: parseInt(document.getElementById('idleThreshold').value),
          }
        });
        await core.invoke('set_autostart', { enabled: document.getElementById('autostart').checked });
        window.__TAURI__.window.getCurrentWindow().close();
      } catch(e) { console.error('Save error:', e); }
    };

    window.__cancelSettings = async function() {
      try {
        const ok = await core.invoke('confirm_dialog', { message: '确定要取消吗？' });
        if (!ok) return;
        window.__TAURI__.window.getCurrentWindow().close();
      } catch(e) { console.error('Cancel error:', e); }
    };
  </script>
  <div id="errorMsg" style="display:none;color:#e94560;padding:40px;text-align:center">无法连接到后端服务</div>
</body>
</html>
