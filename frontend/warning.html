<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>爱眼卫士 提醒</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: #0a1628;
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .warning-icon {
      font-size: 32px;
      color: #e94560;
      margin-bottom: 12px;
    }
    .message {
      font-size: 16px;
      color: #e0e0e0;
      text-align: center;
      padding: 0 20px;
    }
  </style>
</head>
<body>
  <div class="warning-icon">&#9888;</div>
  <div class="message">3 分钟后即将休息</div>
</body>
</html>
